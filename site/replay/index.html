<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay – Archives de la Faille</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="stage">
    <!-- ===================== Panneau gauche ===================== -->
    <section id="panel">
      <header id="top">
        <div id="clock">00:00</div>
        <div id="score"><span class="lead red" id="lead-red"></span><span class="red" id="score-red">0</span><span class="dash">-</span><span class="blue" id="score-blue">0</span><span class="lead blue" id="lead-blue"></span></div>
      </header>
      <div id="teams"></div>
      <div id="goldgraph"></div>
    </section>

    <!-- ===================== Carte ===================== -->
    <section id="map-wrap">
      <div id="map">
        <img id="map-img" alt="">
        <div id="layer-buildings"></div>
        <div id="layer-monsters"></div>
        <div id="layer-recalls"></div>
        <div id="layer-fx"></div>
        <div id="layer-champs"></div>
        <div id="banner" hidden></div>
      </div>
    </section>

    <!-- ===================== Contrôles ===================== -->
    <footer id="controls">
      <button id="btn-play" title="Lecture / pause (Espace)">
        <svg viewBox="0 0 24 24" class="ico-play"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg viewBox="0 0 24 24" class="ico-pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <div id="timebar">
        <div id="bubbles"></div>
        <div id="hover-bubble" hidden></div>
        <div id="markers"></div>
        <div id="track"><div id="progress"></div></div>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position dans la partie">
      </div>
      <div id="speeds"></div>
    </footer>
  </div>

  <div id="tooltip" hidden></div>

  <script src="viewer.js"></script>
</body>
</html>
